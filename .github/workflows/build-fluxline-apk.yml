name: Build FLUXLINE APK

on:
  push:
    branches: [fluxline-godot]
    paths:
      - 'fluxline/**'
      - '.github/workflows/build-fluxline-apk.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android export tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Export Godot Android build
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          relative_project_path: ./fluxline
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Collect APK
        run: |
          mkdir -p dist
          APK=$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" dist/Fluxline.apk
          file dist/Fluxline.apk
          sha256sum dist/Fluxline.apk
          ls -lh dist/Fluxline.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLUXLINE-APK
          path: dist/Fluxline.apk
          if-no-files-found: error
          retention-days: 14
